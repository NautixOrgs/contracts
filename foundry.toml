[profile.default]
src = "src"
out = "build/forge"
cache_path = "build/forge-cache"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
verbosity = 3
# The deploy script reads the auditor key file and writes the deployment record.
fs_permissions = [
    { access = "read", path = "./ceremony" },
    { access = "read", path = "./deployments" },
    { access = "write", path = "./deployments" },
]

# Local node used by the end-to-end smoke test. Mirrors Robinhood Chain testnet.
[profile.anvil]
# The tree is deep and every transaction hashes ~47 Poseidon nodes.
block_gas_limit = 60000000
